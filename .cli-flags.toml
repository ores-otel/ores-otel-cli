[help]
url = "https://github.com/ores-otel/ores-otel-cli"

[parse]
allow_unknown = false

[flags.api-base]
env = "ORES_OTEL_API_BASE"
aliases = ["api-base"]
type = "string"
default = "http://127.0.0.1:8080"
help = "API HTTP base URL."

[flags.json]
env = "ORES_OTEL_JSON"
aliases = ["json"]
type = "bool"
help = "Force JSON output; --no-json forces human output. If unset, stdout TTY selects human vs JSON automatically."

[flags.color]
env = "ORES_OTEL_COLOR"
aliases = ["color"]
type = "bool"
help = "Force ANSI color; --no-color disables it. If unset, color follows the destination TTY and NO_COLOR/FORCE_COLOR conventions."

[flags.log-level]
env = "ORES_OTEL_LOG_LEVEL"
aliases = ["log-level"]
type = "string"
default = "info"
help = "Log threshold: silent, quiet, error, warn, info, debug, or trace."

[commands.health]
help = "Check API health."

[commands.status]
help = "Show service status."
