[help]
url = "https://github.com/ores-otel/ores-otel-cli"

[parse]
allow_unknown = false

[flags.api-base]
env = "ORES_OTEL_API_BASE"
aliases = ["api-base"]
type = "string"
default = "http://127.0.0.1:8080"
help = "API HTTP base URL."

[flags.json]
env = "ORES_OTEL_JSON"
aliases = ["json"]
type = "bool"
default = false
help = "Emit JSON."

[commands.health]
help = "Check API health."

[commands.status]
help = "Show service status."
